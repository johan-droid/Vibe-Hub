name: Vibe Hub CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: write
  security-events: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Production sanitation
        run: npm run sanitize

      - name: Lint frontend
        run: npm run lint --workspace=apps/user-interface

      - name: Validate server syntax
        run: npm run validate

      - name: Run integration smoke tests
        run: npm run test --workspace=apps/server-bridge -- test/api.test.js test/integration-api.test.js

      - name: Run server tests
        run: npm run test --workspace=apps/server-bridge -- --coverage --silent

      - name: Run frontend unit tests
        run: npm run test:unit --workspace=apps/user-interface

      - name: Build frontend
        run: npm run build:ui

      - name: Agentic security audit
        run: npm run security:audit

      - name: Dependency security audit
        run: npm audit --workspaces --audit-level=high

  immutable-images:
    runs-on: ubuntu-latest
    needs: quality-gate
    env:
      REGISTRY: ghcr.io
      IMAGE_NAMESPACE: ${{ github.repository_owner }}/vibe-hub
    steps:
      - uses: actions/checkout@v4

      - name: Set image tags
        id: tags
        run: |
          echo "server_local=vibe-hub-server-bridge:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "ui_local=vibe-hub-user-interface:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "server_remote=${REGISTRY}/${IMAGE_NAMESPACE}/server-bridge:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "ui_remote=${REGISTRY}/${IMAGE_NAMESPACE}/user-interface:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build server image
        run: docker build -f apps/server-bridge/Dockerfile -t "${{ steps.tags.outputs.server_local }}" .

      - name: Build UI image
        run: docker build -f apps/user-interface/Dockerfile -t "${{ steps.tags.outputs.ui_local }}" .

      - name: Scan server image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.tags.outputs.server_local }}
          format: sarif
          output: trivy-server-bridge.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Scan UI image
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.tags.outputs.ui_local }}
          format: sarif
          output: trivy-user-interface.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Upload server scan
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-server-bridge.sarif
          category: server-bridge-scan

      - name: Upload UI scan
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-user-interface.sarif
          category: user-interface-scan

      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push immutable images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag "${{ steps.tags.outputs.server_local }}" "${{ steps.tags.outputs.server_remote }}"
          docker tag "${{ steps.tags.outputs.ui_local }}" "${{ steps.tags.outputs.ui_remote }}"
          docker push "${{ steps.tags.outputs.server_remote }}"
          docker push "${{ steps.tags.outputs.ui_remote }}"

  deploy-render:
    runs-on: ubuntu-latest
    needs: immutable-images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    steps:
      - name: Trigger Render deploy hook
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
