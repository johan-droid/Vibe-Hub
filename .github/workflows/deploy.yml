name: Vibe_Brain_CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Validate Server Syntax
        run: |
          node --check apps/server-bridge/index.js
          node --check apps/server-bridge/orchestrator/index.js
          node --check apps/server-bridge/orchestrator/skill-loader.js
          node --check apps/server-bridge/orchestrator/expert-base.js
          echo "✅ Server syntax OK"

      - name: Build Frontend
        run: npm run build:ui

  # Deployment is now handled directly by Render Blueprints (auto-deploy on push)
  # This bypasses the need for GitHub Actions secrets like RENDER_API_KEY.
