name: Vibe Hub CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main ]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Start Redis and Postgres services
        run: |
          docker run --name pg-test -e POSTGRES_PASSWORD=postgres -d -p 5432:5432 postgres:15
          docker run --name redis-test -d -p 6379:6379 redis:7
          # Wait for services to be ready
          sleep 5

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint --workspace=apps/user-interface

      - name: Validate server syntax
        run: npm run validate

      - name: Run server tests
        run: npm run test --workspace=apps/server-bridge -- --coverage

      - name: Build frontend
        run: npm run build:ui

      - name: Security audit
        run: npm audit --workspaces --audit-level=high

  deploy-render:
    runs-on: ubuntu-latest
    needs: quality-gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    steps:
      - name: Trigger Render deploy hook
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
