apiVersion: v1
kind: Service
metadata:
  name: server-bridge-preview
  namespace: vibe-hub
spec:
  selector:
    app.kubernetes.io/name: server-bridge
    track: preview
  ports:
    - name: http
      port: 3001
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: server-bridge-green
  namespace: vibe-hub
  labels:
    app.kubernetes.io/name: server-bridge
    track: preview
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: server-bridge
      track: preview
  template:
    metadata:
      labels:
        app.kubernetes.io/name: server-bridge
        app.kubernetes.io/part-of: vibe-hub
        track: preview
        version: green
    spec:
      serviceAccountName: server-bridge
      terminationGracePeriodSeconds: 35
      containers:
        - name: server-bridge
          image: ghcr.io/OWNER/vibe-hub/server-bridge:REPLACE_WITH_GREEN_SHA
          ports:
            - name: http
              containerPort: 3001
          envFrom:
            - configMapRef:
                name: server-bridge-config
            - secretRef:
                name: server-bridge-secrets
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 10"]
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
