apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-interface
  namespace: vibe-hub
  labels:
    app.kubernetes.io/name: user-interface
    app.kubernetes.io/part-of: vibe-hub
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: user-interface
  template:
    metadata:
      labels:
        app.kubernetes.io/name: user-interface
        app.kubernetes.io/part-of: vibe-hub
        version: stable
    spec:
      terminationGracePeriodSeconds: 20
      containers:
        - name: user-interface
          image: ghcr.io/OWNER/vibe-hub/user-interface:REPLACE_WITH_SHA
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: user-interface
  namespace: vibe-hub
  labels:
    app.kubernetes.io/name: user-interface
spec:
  selector:
    app.kubernetes.io/name: user-interface
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: user-interface
  namespace: vibe-hub
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: user-interface
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: user-interface
  namespace: vibe-hub
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: user-interface
