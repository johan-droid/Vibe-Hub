apiVersion: apps/v1
kind: Deployment
metadata:
  name: server-bridge-canary
  namespace: vibe-hub
  labels:
    app.kubernetes.io/name: server-bridge
    app.kubernetes.io/part-of: vibe-hub
    version: canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: server-bridge
      version: canary
  template:
    metadata:
      labels:
        app.kubernetes.io/name: server-bridge
        app.kubernetes.io/part-of: vibe-hub
        version: canary
    spec:
      serviceAccountName: server-bridge
      terminationGracePeriodSeconds: 35
      containers:
        - name: server-bridge
          image: ghcr.io/OWNER/vibe-hub/server-bridge:REPLACE_WITH_CANARY_SHA
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
          envFrom:
            - configMapRef:
                name: server-bridge-config
            - secretRef:
                name: server-bridge-secrets
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: server-bridge
  namespace: vibe-hub
spec:
  host: server-bridge.vibe-hub.svc.cluster.local
  trafficPolicy:
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 30s
      baseEjectionTime: 2m
  subsets:
    - name: stable
      labels:
        version: stable
    - name: canary
      labels:
        version: canary
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: server-bridge
  namespace: vibe-hub
spec:
  hosts:
    - server-bridge.vibe-hub.svc.cluster.local
  http:
    - route:
        - destination:
            host: server-bridge.vibe-hub.svc.cluster.local
            subset: stable
          weight: 95
        - destination:
            host: server-bridge.vibe-hub.svc.cluster.local
            subset: canary
          weight: 5
