services:
  # ===== BACKEND: Server Bridge (Selina Core) =====
  - type: web
    name: vibe-hub-bridge
    runtime: node
    region: oregon
    plan: free
    rootDir: apps/server-bridge
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: UI_ORIGIN
        value: https://vibe-hub-ui.onrender.com
      - key: GEMINI_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: vibe-hub-db
          property: connectionString
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_PRIVATE_KEY
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://vibe-hub-bridge.onrender.com/api/auth/google/callback
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_REDIRECT_URI
        value: https://vibe-hub-bridge.onrender.com/api/auth/github/callback

  # ===== FRONTEND: React Cockpit (Bento UI) =====
  - type: web
    name: vibe-hub-ui
    runtime: static
    region: oregon
    plan: free
    rootDir: apps/user-interface
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: vibe-hub-db
    plan: free
    region: oregon
    databaseName: vibehub
    user: vibehub
