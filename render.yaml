services:
  # ===== BACKEND: Server Bridge (Selina Core) =====
  - type: web
    name: vibe-hub-bridge
    runtime: node
    region: oregon
    plan: free
    rootDir: apps/server-bridge
    buildCommand: npm install --legacy-peer-deps
    startCommand: node index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: UI_ORIGIN
        value: https://vibe-hub-ui.onrender.com
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CSRF_SECRET
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        sync: true
      - key: REDIS_URL
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: ORCHESTRATION_WORKER_CONCURRENCY
        value: 2
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_PRIVATE_KEY
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://vibe-hub-bridge.onrender.com/api/auth/google/callback
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_REDIRECT_URI
        value: https://vibe-hub-bridge.onrender.com/api/auth/github/callback

  # ===== FRONTEND: React Cockpit (Bento UI) =====
  - type: web
    name: vibe-hub-ui
    runtime: static
    rootDir: apps/user-interface
    buildCommand: npm install --legacy-peer-deps && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE
        value: https://vibe-hub-bridge.onrender.com
      - key: VITE_WS_BASE
        value: wss://vibe-hub-bridge.onrender.com
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
